# 部署 dist/ 到 GitHub Pages
# - 用户/组织站（仓库名 = <owner>.github.io）→ 根路径，BASE_PATH 为空
# - 项目站（如 anynavs/website → https://anynavs.github.io/website/）→ BASE_PATH=/<repo>
# workers.dev / pages.dev / Vercel / Netlify 等根路径部署不要设 BASE_PATH
name: Deploy GitHub Pages

on:
    push:
        branches: [main]

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - run: npm ci

            - name: Set BASE_PATH for project pages
              run: |
                  OWNER="${{ github.repository_owner }}"
                  REPO="${{ github.event.repository.name }}"
                  if [ "$REPO" = "${OWNER}.github.io" ]; then
                    echo "BASE_PATH=" >> "$GITHUB_ENV"
                    echo "User/org pages → BASE_PATH empty"
                  else
                    echo "BASE_PATH=/${REPO}" >> "$GITHUB_ENV"
                    echo "Project pages → BASE_PATH=/${REPO}"
                  fi

            - run: npm run build

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/deploy-pages@v4
              id: deployment

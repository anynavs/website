# 将 dist/ 部署到 GitHub Pages（适用于仓库名为 username.github.io 时的 https://username.github.io）
name: Deploy GitHub Pages

on:
    push:
        branches: [main]

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - run: npm ci

            - run: npm run build

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/deploy-pages@v4
              id: deployment

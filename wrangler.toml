# Cloudflare Pages：仅此文件；不得含 `[assets]`（Pages 校验不支持，会构建失败）
# Git：Build command `npm run build`；V2 build system；wrangler ≥3.45
# CLI：`npx wrangler pages deploy dist`
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# Workers 静态资源：根目录 `wrangler.toml` 不能含 `[assets]`（Pages 会报错）。
# Pages 控制台「Deploy command」勿写 `wrangler deploy`（会读本文件且无入口）；
# 应写：`npx wrangler deploy --config wrangler.worker.toml` 或 `npm run deploy:worker`
name = "anynavs"
compatibility_date = "2026-04-07"

pages_build_output_dir = "./dist"

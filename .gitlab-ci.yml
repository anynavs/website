# GitLab Pages: 构建后把 dist 打成 public，由 Pages 托管
# 访问地址一般为 https://<namespace>.gitlab.io/<project-name>/ （不是 *.gitlab.com 子域）
# 文档: https://docs.gitlab.com/ee/user/project/pages/
#
# 自动部署: push 到默认分支会触发本流水线，成功后 Pages 即更新（无需再点 deploy）。
# 项目里 Settings → CI/CD → General pipelines 勿关闭 Pipelines；需有可用 Runner。

workflow:
    rules:
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

image: node:22

variables:
    NPM_CONFIG_FUND: "false"
    NPM_CONFIG_AUDIT: "false"

cache:
    key:
        files:
            - package-lock.json
    paths:
        - node_modules/

pages:
    stage: deploy
    script:
        - npm ci
        - npm run build
        - mv dist public
    artifacts:
        paths:
            - public
